name: HedgeModAPI engine build probe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/hedgemodapi-engine-probe
    paths:
      - ".github/workflows/hedgemodapi-engine-probe.yml"
      - "experiments/hedgemodapi/**"

permissions:
  contents: read

jobs:
  build-isolated-engine:
    name: Build isolated RSDKv5U WebAssembly engine
    runs-on: ubuntu-latest
    container: emscripten/emsdk:6.0.2
    steps:
      - name: Check out this experimental branch
        uses: actions/checkout@v4

      - name: Check out pinned RSDKv5 WASM build recipe
        uses: actions/checkout@v4
        with:
          repository: wasm-gaming/rsdkv5-wasm
          ref: 0f65d029a2d111bd06c555b43694a298c7225086
          path: .probe/rsdkv5-wasm

      - name: Build engine in isolated workspace
        run: bash .probe/rsdkv5-wasm/scripts/build.sh

      - name: Validate WebAssembly module
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const path = '.probe/rsdkv5-wasm/dist/rsdkv5/rsdkv5.wasm';
          const bytes = await readFile(path);
          const module = await WebAssembly.compile(bytes);
          const exports = WebAssembly.Module.exports(module).map(x => x.name);
          console.log('WASM bytes:', bytes.byteLength);
          console.log('WASM exports:', exports.join(', '));
          if (exports.length === 0) {
            throw new Error('Expected the isolated engine build to expose WebAssembly exports');
          }
          // Emscripten may minify/rename raw WebAssembly export names.
          // The baseline probe therefore validates module integrity and a
          // non-empty export surface, not a literal "main" export name.
          if (exports.some(name => /hedge|playerstate/i.test(name))) {
            throw new Error('Unexpected HedgeModAPI/player-state export in baseline probe');
          }
          const js = await readFile('.probe/rsdkv5-wasm/dist/rsdkv5/rsdkv5.js', 'utf8');
          if (!js.includes('instantiateWasm') && !js.includes('WebAssembly')) {
            throw new Error('Expected the Emscripten JavaScript loader alongside the WASM module');
          }
          NODE

      - name: Upload isolated engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hedgemodapi-isolated-rsdkv5-wasm
          path: .probe/rsdkv5-wasm/dist/rsdkv5/
          if-no-files-found: error
          retention-days: 7
